# ==============================================================================
# OneLauncher 配置文件
# 说明：修改配置保存后，可在系统托盘右键菜单中点击“重载配置”手动生效，无需重启程序。
# ==============================================================================

[general]
# 全局呼出/隐藏快捷键 (支持 Alt+Space, Ctrl+Space, Win+Space 等)
hotkey = "Alt+Space"
# 窗口失去焦点时是否自动隐藏
hide_on_blur = true
# 唤出时是否清空上一次的输入
clear_on_show = true
# 最大展示的搜索条目数量
max_results = 8
# 插件检索防抖时间 (毫秒)
plugin_debounce_ms = 100

[appearance]
# 主题模式: "system" (跟随系统), "dark" (深色), "light" (浅色)
theme = "system"
# 启动器宽度 (像素)
width = 680
# 字体大小 (像素)
font_size = 16
# 背景视觉效果: "mica" (云母), "acrylic" (亚克力), "solid" (纯色)
backdrop_effect = "mica"

[apps]
# 应用程序扫描的后缀名单
extensions = ["lnk", "exe", "url"]
# 是否扫描 Windows UWP (应用商店/系统内置) 应用
scan_uwp = true
# 扫描排除词（若包含以下关键词则不收录）
exclude_patterns = ["卸载", "Uninstall", "Help", "Readme"]
# 用户自选的额外扫描目录
extra_directories = [
    # "D:\\PortableApps",
    # "D:\\Tools",
]

# ==============================================================================
# 日志配置 [log]
# ==============================================================================
[log]
# 日志过滤级别: "trace", "debug", "info", "warn", "error", "silent" (默认为 "info")
# 设置为 "silent" 时不输出日志
level = "info"
# 日志输出目标:
# - "std": 输出到终端控制台
# - "fs:<path>": 输出到指定文件 (例如 "fs:logs/one-launcher.log")
path = "fs:logs/one-launcher.log"

# ==============================================================================
# 插件配置 [plugins]
# ==============================================================================
[plugins.everything]
enabled = true
prefix = "fs:"
name = "Everything 全盘搜索"
path = "plugins/everything"
# entry = "index.js"

[plugins.everything.config]
max_results = 9

[plugins.calculator]
enabled = true
prefix = "="
name = "极速计算器"
path = "plugins/calculator"
# entry = "index.js"

[plugins.calculator.config]
precision = 6

[plugins.totp]
enabled = true
prefix = "otp:"
name = "动态验证码"
path = "plugins/totp"
# entry = "index.js"

[plugins.totp.config]
interval = 30
algorithm = "SHA1"
