# ==============================================================================
# OneLauncher 配置文件
# 说明：修改配置保存后，可在系统托盘右键菜单中点击“重载配置”手动生效，无需重启程序。
# ==============================================================================

[general]
# 全局呼出/隐藏快捷键 (支持 Alt+Space, Ctrl+Space, Win+Space 等)
hotkey = "Alt+Space"
# 窗口失去焦点时是否自动隐藏
hide_on_blur = true
# 唤出时是否清空上一次的输入
clear_on_show = true
# 最大展示的搜索条目数量
max_results = 8
# 插件检索防抖时间 (毫秒)
plugin_debounce_ms = 100

[appearance]
# 启动器窗口宽度 (像素，最小为 500)
width = 680

[apps]
# 应用程序扫描的后缀名单
extensions = ["lnk", "exe", "url"]
# 是否扫描 Windows UWP (应用商店/系统内置) 应用
scan_uwp = true
# 扫描排除词（若包含以下关键词则不收录）
exclude_patterns = ["卸载", "Uninstall", "Help", "Readme"]
# 用户自选的额外扫描目录
extra_directories = [
    # "D:\\PortableApps",
    # "D:\\Tools",
]

# ==============================================================================
# 日志配置 [log]
# ==============================================================================
[log]
# 日志过滤级别: "trace", "debug", "info", "warn", "error", "silent" (默认为 "info")
# 设置为 "silent" 时不输出日志
level = "info"
# 日志输出目标:
# - "std": 输出到终端控制台
# - "fs:<path>": 输出到指定文件 (例如 "fs:logs/one-launcher.log")
path = "fs:logs/one-launcher.log"

# ==============================================================================
# 插件配置 [plugins]
# 默认下发不携带/不启用任何预装插件。若需添加插件，可按如下格式配置：
#
# [plugins.my_plugin]
# enabled = true
# # path 为可选配置，默认指向 "plugins/<plugin-id>"
# # path = "plugins/my_plugin"
# # prefix 与 name 可选（若省略则自动从插件 index.js 中的 metadata 读取）
# # prefix = "cmd:"
# # name = "我的插件"
# # entry = "index.js"
#
# [plugins.my_plugin.config]
# custom_key = "value"
# ==============================================================================
[plugins]
