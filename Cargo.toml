[package]
name = "one-launcher"
version = "0.1.0"
edition = "2024"
authors = ["Evalexp"]
description = "A blazingly fast, lightweight launcher for Windows with Everything integration"

[dependencies]
# 序列化与配置
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# 目录
dirs = "5.0"

# 高性能并发通道与锁
crossbeam-channel = "0.5"
parking_lot = "0.12"

# 拼音与模糊匹配
pinyin = "0.10"
fuzzy-matcher = "0.3"

# 日志与跟踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rquickjs = "0.14.0"
libloading = "0.9.0"

# 网络请求
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls", "socks"] }

# Windows 原生 API 绑定
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
